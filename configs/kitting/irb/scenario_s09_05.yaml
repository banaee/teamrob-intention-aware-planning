# configs/kitting/irb/scenario_s09_05.yaml — the IRB's run file for scenario_s09_05 on the enlarged room (IRB.4b;
# design_decisions.md, "The intention-recognition test-bed (IRB)"; analysis/kitting/irb/README.md). Run from the repo root:
#   PYTHONHASHSEED=0 python mesa_sim/run_mesa.py --run configs/kitting/irb/scenario_s09_05.yaml
# steps: the replay expanded per tick ends with the exit walk's acknowledgement at tick 239; plus 30 ticks of the idle
# human (E5's standing threshold at the lowest reported level, alpha = 0.01, is 25 ticks), 270 in all. run.sh
# computes the same rule from the replay and runs with it.

domain: kitting
layout: env_layout_11
setup: env_setup_09
scenario: scenario_s09_05
steps: 270
assignment_knowledge: true
context_knowledge: false
strategy: "single_task"
gate_strategy: "none"
cost_strategy: "realized"
separation_stop: false
test_level: 0.05
