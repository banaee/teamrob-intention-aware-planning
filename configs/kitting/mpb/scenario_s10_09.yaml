# configs/kitting/mpb/scenario_s10_09.yaml — the meta-planner test-bed's run file for scenario_s10_09 (MPB; design_decisions.md,
# "The meta-planner test-bed (MPB)"; analysis/kitting/mpb/README.md). Run from the repo root:
#   PYTHONHASHSEED=0 python mesa_sim/run_mesa.py --run configs/kitting/mpb/scenario_s10_09.yaml
# steps: the safety cap of MPB-5 (TODO-138): the robot's pool chained along its authored order from its start on
# plain cost, plus the human's replay length, plus the idle margin (30 ticks); analysis/instruments/mpb/run.sh recomputes it and
# runs with it. Not a behavioural timeout: a run that does not complete within it is classified, never given more.
# The primary set: prior on, single_task; run.sh passes --strategy full_reorder and --assignment_prior false for the
# second run and the diagnostic appendix.

domain: kitting
layout: env_layout_12
setup: env_setup_10
scenario: scenario_s10_09
steps: 383
assignment_prior: true
strategy: "single_task"
gate_strategy: "none"
cost_strategy: "realized"
separation_stop: false
test_level: 0.05
