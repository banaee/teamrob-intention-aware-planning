# configs/experiment.yaml
# Default experiment configuration.
# Every key is a run option, and each has a CLI flag of the same name that overrides it:
# --domain, --layout, --scenario, --steps, --assignment_prior, --strategy, --gate_strategy, --cost_strategy,
# --separation_stop (and --run, the path of this file: the run file). mesa_sim/run_mesa.py rejects an
# unknown key or flag, a strategy outside its choices, and a switch that is not true/false.
# layout is optional (here and on the CLI): a run that names none takes the scenario's first
# reference layout. setup may be named here (no CLI flag); it must equal the scenario's (T-L).
# overrides (T-L stage 4): an optional block, one fact of the run's artefacts per line, the same
# paths as --override <path>=<value>; each is printed on the [run_mesa] start block, and a run
# with an override is never a fixture or a baseline. The closed list:
#   overrides:
#     scenario.human_0.start_position: [460, 350]    # an agent's start, two numbers
#     layout.shelf_2.position: [-300, -300]          # a fixed object's position, two numbers
#     setup.item_4.initial_container: shelf_5        # a movable object's home container, an id

domain: kitting
scenario: scenario_s01_01
steps: 50

# Give the robot the observed human's work order: the recognizer's support is restricted to the assigned and foreseeable tasks (evaluation switch, not a scenario fact)
assignment_prior: false

# MetaPlanner B3 strategy: "single_task" (default: the cheapest next task) | "full_reorder" (B3.B: the head of the cheapest ordering of the pool; on plain cost, T-B2b)
strategy: "single_task"

# MetaPlanner B2 gate strategy: "none" (default, always escalates to B3) | "b2a" (T4) | "b2b" (stub)
gate_strategy: "none"

# MetaPlanner B3 cost strategy: "realized" (default: argmin of T_r + hold, T10) | "plain" (argmin of T_r; comparison only)
cost_strategy: "realized"

# Execution-time separation stop (C, TODO-73): the robot refuses a STEP that would break the F1 rule against the human's actual position. Off keeps the baselines.
separation_stop: false
