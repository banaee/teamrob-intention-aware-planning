# configs/experiment.yaml
# Default experiment configuration.
# CLI args override individual fields: --domain, --layout, --scenario, --steps, --planner, --recognizer

domain: kitting
layout: env_layout0
scenario: scenario_00
steps: 50
planner: basic
recognizer: uniform_make_domain_model

# Give the robot the observed human's work order as a persistent IR prior (evaluation switch, not a scenario fact)
assignment_prior: false

# MetaPlanner B2 gate strategy: "none" (default, always escalates to B3) | "b2a" (T4) | "b2b" (stub)
gate_strategy: "none"

# MetaPlanner B3 cost strategy: "realized" (default: argmin of T_r + hold, T10) | "plain" (argmin of T_r; comparison only)
cost_strategy: "realized"

# Execution-time separation stop (C, TODO-73): the robot refuses a STEP that would break the F1 rule against the human's actual position. Off keeps the baselines.
separation_stop: false
