# configs/scenarios.yaml
# Simulation Scenarios
# Defines initial conditions, agent roles, and task assignments
#
# This is the minimal test scenario for skeleton validation.
# One human, one robot. Human deviates to COFFEE_BREAK after first delivery.

scenarios:

  - id: scenario_01
    name: basic_kitting_with_coffee_break
    description: >
      Human and robot each deliver two items to the kitting table.
      Human deviates to a coffee break after completing their first delivery.
      Robot must recognize the deviation and replan accordingly.

    # Environment to load (must match configs/domain.yaml)
    domain: test_kitting_cell

    # Agent definitions
    agents:

      - id: human_1
        type: human
        start_position: [400, 600]      # zone_NW, near kitting table
        assigned_tasks:
          - task: DELIVER_ITEM
            parameters: {item_id: item_1}   # item_1 on shelf_1 (zone_SW)
          - task: DELIVER_ITEM
            parameters: {item_id: item_2}   # item_2 on shelf_2 (zone_SW)
        # After completing item_1 delivery, human deviates to coffee break
        foreseeable_deviation:
          after_task: 0                 # index into assigned_tasks (0 = after item_1)
          task: COFFEE_BREAK

      - id: robot_1
        type: robot
        start_position: [1200, 600]     # zone_NE
        assigned_tasks:
          - task: DELIVER_ITEM
            parameters: {item_id: item_3}   # item_3 on shelf_3 (zone_SE)
          - task: DELIVER_ITEM
            parameters: {item_id: item_2}   # fallback if human skips it
        observes: [human_1]             # which agents this robot monitors
