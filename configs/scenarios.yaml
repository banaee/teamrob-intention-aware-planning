# configs/scenarios.yaml
# Simulation Scenarios
# Defines initial conditions, agent roles, and task assignments
#
# Human task list is flat and ordered — the sequence is exactly what the human executes.
# 'origin' distinguishes assigned team tasks from foreseeable personal behaviors.
# The robot reads origin from tasks_library.yaml (knowledge), not from here.

scenarios:

  - id: scenario_01
    name: basic_kitting_with_coffee_break
    description: >
      Human delivers item_1, takes a coffee break, then delivers item_2.
      Robot delivers item_3 and item_2 (fallback).
      Robot must recognize the coffee break deviation and replan accordingly.

    domain: domain1

    agents:

      - id: human_0
        type: human
        start_position: [-400, -300]   # zone_SW, center-origin
        tasks:
          - task: DELIVER_ITEM
            parameters: {item_id: item_1}
            origin: assigned
          - task: COFFEE_BREAK
            parameters: {}
            origin: foreseeable
          - task: DELIVER_ITEM
            parameters: {item_id: item_2}
            origin: assigned

      - id: robot_0
        type: robot
        start_position: [200, 200]     # zone_NE, center-origin
        assigned_tasks:
          - task: DELIVER_ITEM
            parameters: {item_id: item_3}
          - task: DELIVER_ITEM
            parameters: {item_id: item_2}
        observes: [human_0]