services:
  framework-hri:
    image: framework-hri:humble

    build:
      context: .
      dockerfile: Dockerfile

    network_mode: host
    ipc: host

    environment:
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

    stdin_open: true
    tty: true

    command: bash
